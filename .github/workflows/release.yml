name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Attach card to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stamp the published version into the card before packaging.
      - name: Set version
        run: |
          sed -i "s/const CARD_VERSION = \".*\";/const CARD_VERSION = \"${GITHUB_REF_NAME#v}\";/" dist/ha-uv-card.js

      - name: Upload ha-uv-card.js to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-uv-card.js
