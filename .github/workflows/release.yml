name: Release

# Run it by hand with the version to release (Actions → Release → Run workflow), or publish a release
# from the GitHub UI: either way the card is stamped with the version and attached to the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true
      notes:
        description: "Release notes (Markdown)"
        required: false
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Attach card to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            echo "tag=v${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # Stamp the released version into the card before packaging.
      - name: Set version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sed -i "s/const CARD_VERSION = \".*\";/const CARD_VERSION = \"${TAG#v}\";/" dist/ha-uv-card.js

      - name: Create the release or attach ha-uv-card.js to it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ha-uv-card.js --clobber
          else
            gh release create "$TAG" dist/ha-uv-card.js --target "$GITHUB_SHA" --title "$TAG" --notes "${NOTES:-Release $TAG}"
          fi
