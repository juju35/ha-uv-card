name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "icons/**"
      - "scripts/**"
      # The browser tests below run here, where Chromium and ffmpeg are installed.
      - "test/**"
      # A Playwright bump changes the rendering too.
      - "package.json"
      - "package-lock.json"

# Protected main is never pushed to: the job commits the refreshed screenshots
# back onto the pull request's own branch, so they land through the normal merge.
permissions:
  contents: write
  actions: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork PR branches do not exist in this repository: only check out the
          # head branch for same-repo PRs (where screenshots get pushed back).
          # Everything else keeps the default ref — for a fork PR that is the merge
          # ref, which github.ref_name ("N/merge") does not resolve to.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # Download the browser binary (no apt here) separately from its system libraries; the download is itself
      # time-boxed and retried, and the apt work all sits in the one time-boxed, retried step below.
      - name: Install Chromium
        timeout-minutes: 12
        run: |
          ok=
          for i in 1 2 3; do
            timeout 300 npx playwright install chromium && ok=1 && break
            echo "download attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::Chromium download failed 3 times"; exit 1; }
      # ffmpeg (required for the GIFs, not preinstalled) + Roboto + the browser's apt deps, each apt call time-boxed
      # and retried so a flaky mirror is abandoned and retried instead of hanging; fail loudly if ffmpeg is missing.
      - name: Install ffmpeg, Roboto and browser deps
        timeout-minutes: 12
        run: |
          ok=
          for i in 1 2 3; do
            timeout 150 sudo apt-get update \
              && timeout 300 sudo apt-get install -y ffmpeg fonts-roboto \
              && timeout 300 npx playwright install-deps chromium \
              && ok=1 && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }
          ffmpeg -version > /dev/null
      - run: npm run build
      # Layout in real parents, ResizeObserver, and the PNG / GIF pixel comparison
      # on real images: skipped in the unit-test job (no browser), required here.
      - name: Browser tests
        run: REQUIRE_BROWSER=1 node --test test/browser.test.mjs
      - name: Render screenshots and GIFs
        run: |
          set -o pipefail
          { npm run screenshots && npm run gifs; } 2>&1 | tee /tmp/screenshots.log || {
            echo "::error::screenshots failed: $(tail -c 1200 /tmp/screenshots.log | tr -d '\r' | tr '\n' ' ')"
            exit 1
          }
      # The pull_request runs of a GITHUB_TOKEN push are left waiting for approval, but workflow_dispatch runs: once a
      # screenshot commit is pushed, the next step dispatches Lint, Validate and HACS on the PR branch.
      - name: Commit refreshed screenshots
        id: commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain screenshots)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore: refresh screenshots"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Re-run checks on the screenshot commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never expanded into the script: a branch name cannot inject commands.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          for wf in lint.yml validate.yml hacs.yml; do
            [ -f ".github/workflows/$wf" ] && gh workflow run "$wf" --ref "$HEAD_REF"
          done
      - name: Upload screenshots (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
